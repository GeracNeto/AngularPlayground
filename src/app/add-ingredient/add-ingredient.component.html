<form class="row row-cols-lg-auto g-3 align-items-center">
    <div class="col-6">
        <input type="text" class="form-control" id="name" placeholder="Ingredient">
    </div>
    <div class="col-6">
        <input type="text"size="5" class="form-control" id="amount" placeholder="Amount">
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-primary" (click)="addIngredient()">Submit</button>
    </div>
</form>
